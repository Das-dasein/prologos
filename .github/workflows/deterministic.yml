name: deterministic-node

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y swi-prolog-nox
      - run: npm ci
      - run: npm test
      - run: npm run test:cdr-gold
