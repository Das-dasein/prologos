<!doctype html>
<meta charset="utf-8">
<title>Entity-centric Prolog memory</title>
<style>
body{margin:0;font:14px system-ui;background:#10141b;color:#e8edf5}header{padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}main{display:grid;grid-template-columns:1fr 320px;gap:12px;padding:0 12px}svg,aside{background:#171d27;border:1px solid #2b3545;border-radius:8px}svg{width:100%;height:calc(100vh - 82px);min-height:440px}.edge{stroke:#6f86a8;stroke-width:2}.edge.negative{stroke:#ef7777;stroke-dasharray:6 4}.node circle{fill:#253247;stroke:#73d2a4;stroke-width:2}.node.root circle{fill:#34506d;stroke:#f2ce7d}.node text{fill:#e8edf5;text-anchor:middle}.relation{text-anchor:middle;fill:#b6c5d9;font-size:12px}aside{padding:14px;overflow:auto}.hint{color:#91a0b6}
</style>
<header><strong>Entity-centric memory</strong><label>Root <input id="root" value="user"></label><input id="file" type="file" accept=".pl"><button id="load" type="button">Load memory</button><span id="count"></span></header>
<main><svg id="graph" viewBox="0 0 1000 680" aria-label="Assertion graph"></svg><aside id="detail"><p class="hint">Select an assertion edge or node.</p></aside></main>
<script>
const svg=document.querySelector('#graph'),detail=document.querySelector('#detail'),count=document.querySelector('#count'),rootInput=document.querySelector('#root');
const demo=`assertion(a1, works_at(user,samara_university)).
assertion_polarity(a1, positive).
assertion_time(a1, unknown).
assertion_source(a1, user_message(m1)).
assertion_confidence(a1, 0.99).
assertion(a2, project_role_at(user,softlink,ust_pace,frontend_developer)).
assertion_polarity(a2, positive).
assertion_time(a2, unknown).
assertion_source(a2, user_message(m2)).
assertion_confidence(a2, 0.98).`;
function atomize(value){return value.trim().replace(/^['"]|['"]$/g,'')}
function parse(src){const rows=new Map(),re=/assertion\(([^,]+),\s*([a-z][a-z0-9_]*)\(([^)]*)\)\)\./g;let m;while((m=re.exec(src))){const id=atomize(m[1]),row=rows.get(id)||{id,relation:m[2],args:m[3].split(',').map(atomize)};row.raw=m[0];rows.set(id,row)}const fields={polarity:/assertion_polarity\(([^,]+),\s*([^\)]+)\)\./g,time:/assertion_time\(([^,]+),\s*([^\)]+)\)\./g,source:/assertion_source\(([^,]+),\s*([^\)]+)\)\./g,confidence:/assertion_confidence\(([^,]+),\s*([^\)]+)\)\./g};for(const[key,re2]of Object.entries(fields))while((m=re2.exec(src))){const row=rows.get(atomize(m[1]));if(row)row[key]=atomize(m[2])}return[...rows.values()]}
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(src){const assertions=parse(src),root=rootInput.value.trim()||'user',selected=assertions.filter(a=>a.args.includes(root)),entities=[...new Set(selected.flatMap(a=>a.args))],pos=new Map([[root,{x:500,y:90}]]);entities.filter(e=>e!==root).forEach((e,i)=>pos.set(e,{x:150+(i%4)*230,y:260+Math.floor(i/4)*170}));svg.innerHTML='';selected.forEach(a=>{const target=a.args.find(e=>e!==root)||root,from=pos.get(root),to=pos.get(target);if(!to)return;const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',from.x);line.setAttribute('y1',from.y);line.setAttribute('x2',to.x);line.setAttribute('y2',to.y);line.classList.add('edge');if(a.polarity==='negative')line.classList.add('negative');line.onclick=()=>detail.innerHTML='<h3>'+esc(a.relation)+'</h3><p><code>'+esc(a.raw)+'</code></p><p>Assertion: '+esc(a.id)+'<br>Polarity: '+esc(a.polarity||'unknown')+'<br>Time: '+esc(a.time||'unknown')+'<br>Source: '+esc(a.source||'unknown')+'<br>Confidence: '+esc(a.confidence||'unknown')+'</p>';svg.append(line);const label=document.createElementNS('http://www.w3.org/2000/svg','text');label.setAttribute('x',(from.x+to.x)/2);label.setAttribute('y',(from.y+to.y)/2-8);label.classList.add('relation');label.textContent=a.relation;svg.append(label)});entities.forEach(e=>{const p=pos.get(e),g=document.createElementNS('http://www.w3.org/2000/svg','g');g.classList.add('node');if(e===root)g.classList.add('root');g.innerHTML='<circle cx="'+p.x+'" cy="'+p.y+'" r="38"></circle><text x="'+p.x+'" y="'+(p.y+4)+'">'+esc(e)+'</text>';g.onclick=()=>{rootInput.value=e;draw(src)};svg.append(g)});count.textContent=selected.length+' assertions · '+entities.length+' entities · root '+root}
function load(src){draw(src)}document.querySelector('#load').onclick=()=>fetch('/data/memory.pl').then(r=>r.text()).then(load).catch(()=>load(demo));document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>load(r.result);r.readAsText(f)}};rootInput.onchange=()=>fetch('/data/memory.pl').then(r=>r.text()).then(load).catch(()=>load(demo));load(demo);if(location.protocol!=='file:')fetch('/data/memory.pl').then(r=>r.text()).then(load).catch(()=>{});
</script>
