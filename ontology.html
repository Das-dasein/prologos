<!doctype html>
<meta charset="utf-8">
<title>Prolog ontology viewer</title>
<style>body{margin:0;font:14px system-ui;background:#10141b;color:#e8edf5}header{padding:16px}main{display:grid;grid-template-columns:1fr 300px;gap:12px;padding:0 12px}svg,aside{background:#171d27;border:1px solid #2b3545;border-radius:8px}svg{width:100%;height:calc(100vh - 90px);min-height:420px}aside{padding:14px}.edge{stroke:#6f86a8;stroke-width:2}.conflict{stroke:#ef7777;stroke-dasharray:6 4}.node circle{fill:#253247;stroke:#73d2a4;stroke-width:2}.node text{fill:#e8edf5;text-anchor:middle}</style>
<header><h1>Prolog ontology</h1><input id="file" type="file" accept=".pl"> <button id="load" type="button">Показать demo</button><span id="count"></span></header>
<main><svg id="graph" viewBox="0 0 900 620"></svg><aside id="detail">Кликните на связь.</aside></main>
<script>
const demo="assertion(c1, works_at(user,samara_university)).\nassertion_polarity(c1, positive).\nassertion_time(c1, unknown).\nassertion_source(c1, user_message(m1)).\nassertion_confidence(c1, 0.99).\nassertion(c2, project_role_at(user,softlink,ust_pace,frontend_developer)).\nassertion_polarity(c2, positive).\nassertion_time(c2, unknown).\nassertion_source(c2, user_message(m2)).\nassertion_confidence(c2, 0.98).\nassertion(c3, knows_technology(user,java)).\nassertion_polarity(c3, positive).\nassertion_time(c3, unknown).\nassertion_source(c3, user_message(m3)).\nassertion_confidence(c3, 0.99).\nassertion(c4, knows_technology(user,angular)).\nassertion_polarity(c4, negative).\nassertion_time(c4, unknown).\nassertion_source(c4, user_message(m4)).\nassertion_confidence(c4, 0.99).";
const svg=document.querySelector("#graph"),detail=document.querySelector("#detail"),count=document.querySelector("#count");
function parse(src){const out=[],re=/claim[(]([^,]+),[ ]*(positive|negative),[ ]*([a-z_]+)[(]([^)]*)[)],[ ]*([^,]+),[ ]*([^,]+),[ ]*([^,]+),[ ]*([^)]+)[)][.]/g;let m;while((m=re.exec(src)))out.push({id:m[1].trim(),polarity:m[2],relation:m[3],args:m[4].split(",").map(x=>x.trim()),source:m[5].trim(),from:m[6].trim(),to:m[7].trim(),confidence:m[8].trim(),raw:m[0]});return out}
function draw(src){const claims=parse(src),entities=[...new Set(claims.flatMap(c=>c.args))],pos=new Map(entities.map((e,i)=>[e,{x:90+(i%4)*210,y:100+Math.floor(i/4)*170}]));svg.innerHTML="";claims.forEach(c=>{const a=pos.get(c.args[0]),b=pos.get(c.args[1]||c.args[0]),line=document.createElementNS("http://www.w3.org/2000/svg","line");line.setAttribute("x1",a.x);line.setAttribute("y1",a.y);line.setAttribute("x2",b.x);line.setAttribute("y2",b.y);line.classList.add("edge");if(c.polarity==="negative")line.classList.add("conflict");line.onclick=()=>detail.innerHTML="<b>"+c.relation+"</b><p>"+c.raw+"</p><p>Источник: "+c.source+"<br>Период: "+c.from+" — "+c.to+"<br>Уверенность: "+c.confidence+"</p>";svg.append(line);const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",(a.x+b.x)/2);t.setAttribute("y",(a.y+b.y)/2-7);t.textContent=c.relation;svg.append(t)});entities.forEach(e=>{const p=pos.get(e),g=document.createElementNS("http://www.w3.org/2000/svg","g");g.classList.add("node");g.innerHTML="<circle cx='"+p.x+"' cy='"+p.y+"' r='34'></circle><text x='"+p.x+"' y='"+(p.y+4)+"'>"+e+"</text>";svg.append(g)});count.textContent=claims.length+" claims · "+entities.length+" entities"}
document.querySelector("#load").onclick=()=>draw(demo);document.querySelector("#file").onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>draw(r.result);r.readAsText(f)}};draw(demo);
if(location.protocol!=="file:") fetch("/data/memory.pl").then(r=>r.text()).then(draw).catch(()=>{});
</script>
